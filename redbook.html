<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收集X的網站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #e0e0e0;
    padding: 24px 16px 48px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.75rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    letter-spacing: 0.05em;
  }
  .home-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 12px 28px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .card {
    display: block;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 20px 22px;
    text-decoration: none;
    color: inherit;
    transition: background 0.25s, transform 0.2s, border-color 0.25s;
    backdrop-filter: blur(8px);
  }
  .card:hover {
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(102, 126, 234, 0.5);
    transform: translateY(-3px);
  }
  .card-desc {
    font-size: 1.05rem;
    line-height: 1.55;
    color: #f0f0f0;
    margin-bottom: 10px;
  }
  .card-domain {
    font-size: 0.85rem;
    color: #a0a0c0;
    font-weight: 500;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: #8888aa;
    line-height: 1.5;
  }
  footer a {
    color: #a0a0e0;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>收集X的網站</h1>
    <a class="home-btn" href="https://terry20250224.github.io/terrypages/multi-search.html">回主頁</a>
    <div class="grid">
      <a class="card" href="https://rebang.today" target="_blank" rel="noopener">
        <div class="card-desc">不被算法绑架，不被推荐页困住。打开看几分钟，今天整个互联网在聊什么、在追什么、什么热度高，心里基本有数。做内容和运营的尤其该看看，一次性掌握全网热点。</div>
        <div class="card-domain">rebang.today</div>
      </a>
    </div>
    <footer>
      数据来源：X 帖子 @Rachel291971464<br>
      <a href="https://x.com/Rachel291971464/status/2092448760412725577" target="_blank" rel="noopener">查看原帖</a>
    </footer>
  </div>
</body>
</html>
