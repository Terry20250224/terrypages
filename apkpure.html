<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收集X的網站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #e0e0e0;
    padding: 20px;
    line-height: 1.5;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 16px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .back-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 12px 28px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 22px 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, background 0.2s, border-color 0.2s;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
  }
  .card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.14);
    border-color: rgba(102, 126, 234, 0.5);
  }
  .card-desc {
    font-size: 1.05rem;
    font-weight: 500;
    color: #f0f0f0;
    margin-bottom: 12px;
  }
  .card-domain {
    font-size: 0.85rem;
    color: #a0a0c0;
    word-break: break-all;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: #8888aa;
  }
  footer a {
    color: #a0a0ff;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>收集X的網站</h1>
    <a class="back-btn" href="https://terry20250224.github.io/terrypages/multi-search.html">回主頁</a>
    
    <div class="grid">
      <a class="card" href="https://apkpure.com/cn/" target="_blank" rel="noopener">
        <div class="card-desc">資源特別全，很多海外 App 都能翻到</div>
        <div class="card-domain">apkpure.com</div>
      </a>
      
      <a class="card" href="https://apkmirror.com/" target="_blank" rel="noopener">
        <div class="card-desc">老牌站了，連歷史版本都給你留著</div>
        <div class="card-domain">apkmirror.com</div>
      </a>
      
      <a class="card" href="https://f-droid.org/zh_Hans/" target="_blank" rel="noopener">
        <div class="card-desc">專做免費開源應用，乾淨沒廣告，好東西一堆</div>
        <div class="card-domain">f-droid.org</div>
      </a>
      
      <a class="card" href="https://en.uptodown.com/" target="_blank" rel="noopener">
        <div class="card-desc">大型第三方商店，App 和遊戲都管夠</div>
        <div class="card-domain">uptodown.com</div>
      </a>
    </div>
    
    <footer>
      資料來源：<a href="https://x.com/NFTCPS/status/2091447124273619102" target="_blank" rel="noopener">@NFTCPS 的 X 貼文</a>
    </footer>
  </div>
</body>
</html>
