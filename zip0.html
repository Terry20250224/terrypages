<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收集X的網站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #e0e0e0;
    padding: 20px;
    line-height: 1.5;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 16px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .back-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 12px 28px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
  .card-desc {
    font-size: 1.05rem;
    color: #f0f0f0;
    flex-grow: 1;
  }
  .card-domain {
    font-size: 0.9rem;
    color: #a0a0ff;
    font-weight: 500;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.85rem;
    color: #888;
  }
  footer a {
    color: #a0a0ff;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>收集X的網站</h1>
    <a class="back-btn" href="https://terry20250224.github.io/terrypages/multi-search.html">回主頁</a>
    <div class="grid">
      <a class="card" href="https://zip0.com?r=ZDGZV0" target="_blank" rel="noopener">
        <div class="card-desc">可看全球几千个电视台直播（含CCTV5+、美国、日本、法国、德国等），还可搜全网影视资源，直接观看、无广告、速度快</div>
        <div class="card-domain">zip0.com</div>
      </a>
    </div>
    <footer>
      数据来源：<a href="https://x.com/ezshine/status/2098564749621625151" target="_blank" rel="noopener">X帖子 @ezshine</a>
    </footer>
  </div>
</body>
</html>
