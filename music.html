<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收集X的網站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #e0e0e0;
    padding: 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 16px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .home-btn {
    display: block;
    width: fit-content;
    margin: 0 auto 28px;
    padding: 10px 28px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 600;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .home-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 24px 20px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
  }
  .card:hover {
    transform: translateY(-6px);
    background: rgba(255, 255, 255, 0.14);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  }
  .card-desc {
    font-size: 1.05rem;
    line-height: 1.5;
    margin-bottom: 14px;
    color: #f0f0f0;
  }
  .card-domain {
    font-size: 0.85rem;
    color: #a0a0c0;
    word-break: break-all;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: #888;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>收集的網站</h1>
    <a class="home-btn" href="https://terry20250224.github.io/terrypages/multi-search.html" target="_blank" rel="noopener">回主頁</a>
    
    <div class="grid">
      <a class="card" href="https://music.gdstudio.org/" target="_blank" rel="noopener">
        <div class="card-desc">GD音樂台（國內版）— 全網曲庫最全、音質最高的在線聽歌聚合平台，支援多音樂源高音質播放</div>
        <div class="card-domain">music.gdstudio.org</div>
      </a>
      
      <a class="card" href="https://www.qqmp3.vip/" target="_blank" rel="noopener">
        <div class="card-desc">米兔音樂 — 免費在線音樂播放器，提供高品質 MP3、FLAC、WAV 等格式試聽與下載</div>
        <div class="card-domain">qqmp3.vip</div>
      </a>
    </div>
    
    <footer>資料來源：使用者提供的連結</footer>
  </div>
</body>
</html>
