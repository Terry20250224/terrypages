<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收集的網站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: #fff;
      letter-spacing: 1px;
    }
    .home-btn {
      display: block;
      width: fit-content;
      margin: 0 auto 28px;
      padding: 12px 28px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s, background 0.25s, border-color 0.25s;
      backdrop-filter: blur(10px);
    }
    .card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(0, 198, 255, 0.5);
    }
    .card-desc {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
      color: #f0f0f0;
    }
    .card-domain {
      font-size: 0.85rem;
      color: #00c6ff;
      word-break: break-all;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>收集的網站</h1>
    <a class="home-btn" href="https://terry20250224.github.io/terrypages/multi-search.html" target="_blank" rel="noopener">回主頁</a>
    
    <div class="grid">
      <a class="card" href="https://fmhy.net/" target="_blank" rel="noopener">
        <div class="card-desc">互聯網上最大的免費資源集合網站（包含廣告攔截、AI、串流、音樂、遊戲、下載、種子、教育、Android/iOS、Linux 等各種免費內容）</div>
        <div class="card-domain">fmhy.net</div>
      </a>
    </div>
    
    <footer>資料來源：使用者提供的網址</footer>
  </div>
</body>
</html>
